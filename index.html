<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0D0B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>풋살 매니저</title>
<style>
  :root {
    --bg: #0A0D0B;
    --panel: #171D19;
    --line: #2C362F;
    --text: #FFFFFF;
    --dim: #9DB0A3;
    --green: #22E06B;
    --yellow: #FFD60A;
    --red: #FF3B30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    flex: none; height: max(56px, 8vh);
    display: flex; align-items: center; gap: 2vw;
    padding: 0 2.5vw;
    border-bottom: 2px solid var(--line);
  }
  .brand { font-size: max(18px, 3vh); font-weight: 800; letter-spacing: -0.02em; }
  .spacer { flex: 1; }
  .chip {
    font-size: max(13px, 2vh); font-weight: 700; color: var(--bg);
    background: var(--green); border-radius: 999px; padding: 0.4em 1em;
    display: none;
  }
  .chip.on { display: block; }
  .topbtn {
    min-height: 56px; height: 6vh; padding: 0 1.6vw;
    font-size: max(15px, 2.3vh); font-weight: 700;
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
  }
  .topbtn:active { background: var(--line); }
  .version { font-size: max(13px, 2vh); color: var(--dim); font-variant-numeric: tabular-nums; }

  /* ---------- 타이머 본문 ---------- */
  .stage {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1vh 2.5vw 0;
  }
  .status {
    font-size: max(20px, 4vh); font-weight: 800; color: var(--dim);
    letter-spacing: 0.04em; line-height: 1.2;
  }
  .time {
    font-size: min(22vw, 34vh);
    font-weight: 800; line-height: 1.05;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    letter-spacing: -0.02em;
  }
  body:not([data-status="idle"]) .time { font-size: min(30vw, 54vh); }

  .progress {
    width: 100%; height: max(10px, 1.6vh); flex: none;
    background: var(--panel); border-radius: 999px; overflow: hidden;
    margin-top: 1vh;
  }
  .progress > div { height: 100%; width: 100%; background: var(--green); border-radius: 999px; transform-origin: left center; }
  body[data-status="idle"] .progress { visibility: hidden; height: 0; margin: 0; }

  /* ---------- 설정 ---------- */
  .settings { width: 100%; display: none; flex-direction: column; gap: 1.6vh; margin-top: 1.5vh; }
  body[data-status="idle"] .settings { display: flex; }
  .row { display: flex; align-items: center; gap: 1vw; }
  .row > label {
    flex: none; width: 13vw;
    font-size: max(16px, 2.6vh); font-weight: 700; color: var(--dim);
  }
  .opts { flex: 1; display: flex; gap: 0.8vw; }
  .opt {
    flex: 1; min-height: 56px; height: 8vh;
    font-size: max(17px, 3vh); font-weight: 800;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
  }
  .opt:active { background: var(--line); }
  .opt.sel { background: var(--text); color: var(--bg); border-color: var(--text); }
  .opt.step { flex: 0.8; color: var(--green); }

  /* ---------- 하단 버튼 ---------- */
  .controls {
    flex: none; display: flex; gap: 1.5vw;
    padding: 2vh 2.5vw 2.5vh;
  }
  .btn {
    min-height: 72px; height: 15vh; border-radius: 20px;
    font-size: max(24px, 5.5vh); font-weight: 800;
  }
  .btn-main { flex: 3; background: var(--green); color: #04130A; }
  .btn-main:active { filter: brightness(0.85); }
  .btn-reset { flex: 1; background: var(--panel); border: 3px solid var(--line); font-size: max(18px, 3.6vh); }
  .btn-reset.armed { background: var(--red); border-color: var(--red); color: #fff; }
  body[data-status="idle"] .btn-reset, body[data-status="ended"] .btn-reset { display: none; }
  body[data-status="running"] .btn-main { background: var(--text); color: var(--bg); }

  /* ---------- 상태별 색 ---------- */
  body[data-status="paused"] .time { animation: blink 1.2s steps(1) infinite; }
  body[data-status="paused"] .status { color: var(--text); }
  @keyframes blink { 50% { opacity: 0.35; } }

  body.warn .time, body.warn .status { color: var(--yellow); }
  body.warn .progress > div { background: var(--yellow); }

  body.flash { animation: flashY 0.5s steps(1) 8; }
  @keyframes flashY { 0% { background: var(--yellow); } 50% { background: var(--bg); } }
  body.flash .time, body.flash .status { animation: flashYText 0.5s steps(1) 8; }
  @keyframes flashYText { 0% { color: #000; } 50% { color: var(--yellow); } }

  body[data-status="ended"] { animation: flashR 0.8s steps(1) infinite; }
  @keyframes flashR { 0% { background: var(--red); } 50% { background: #5A0B07; } }
  body[data-status="ended"] .time, body[data-status="ended"] .status { color: #fff; }
  body[data-status="ended"] .status { font-size: max(32px, 9vh); }
  body[data-status="ended"] .time { font-size: min(22vw, 38vh); }
  body[data-status="ended"] .progress { visibility: hidden; }
  body[data-status="ended"] .btn-main { background: #fff; color: #000; }
  body[data-status="ended"] .topbar { border-color: rgba(255,255,255,0.4); }

  /* ---------- 화면 전환 ---------- */
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body[data-view="timer"] #viewBoard, body[data-view="board"] #viewTimer { display: none; }
  body[data-view="board"] #soundTest, body[data-view="timer"] .mini { display: none; }
  .tabs { display: flex; gap: 0.6vw; }
  .tab {
    min-height: 56px; height: 6vh; padding: 0 2vw;
    font-size: max(16px, 2.6vh); font-weight: 800; color: var(--dim);
    background: transparent; border: 2px solid var(--line); border-radius: 12px;
  }
  .tab.sel { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ---------- 상단 작은 타이머 (전술판에서 표시) ---------- */
  .mini { display: flex; align-items: center; gap: 1.2vw; }
  .mini-status { font-size: max(14px, 2.4vh); font-weight: 800; color: var(--dim); }
  .mini-time { font-size: max(30px, 6.4vh); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .mini-btn { min-width: 9vw; }
  body.warn .mini-time, body.warn .mini-status { color: var(--yellow); }
  body.flash .mini-time, body.flash .mini-status { animation: flashYText 0.5s steps(1) 8; }
  body[data-status="ended"] .mini-time, body[data-status="ended"] .mini-status { color: #fff; }
  body[data-status="paused"] .mini-time { animation: blink 1.2s steps(1) infinite; }

  /* ---------- 전술판 ---------- */
  #viewBoard { padding: 1.2vh 2.5vw 0; }
  .court-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .court { position: relative; touch-action: none; background: #1E8747; border-radius: 10px; }
  .court svg, .court canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: block; border-radius: 10px; }
  .piece {
    position: absolute; z-index: 10; touch-action: none;
    width: var(--ps, 56px); height: var(--ps, 56px);
    margin: calc(var(--ps, 56px) / -2) 0 0 calc(var(--ps, 56px) / -2);
    border-radius: 50%; border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: calc(var(--ps, 56px) * 0.4); color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  }
  .piece.team-a { background: #E8261C; }
  .piece.team-b { background: #1456E0; }
  .piece.drag { transform: scale(1.15); }
  .piece.ball { background: none; border: 0; box-shadow: none; }
  .piece.ball::after {
    content: ''; position: absolute; left: 20%; top: 20%; width: 60%; height: 60%;
    border-radius: 50%; background: #fff; border: 3px solid #111; box-sizing: border-box;
    box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  }
  .tools { flex: none; display: flex; gap: 0.8vw; padding: 1.2vh 0 1.8vh; }
  .tool {
    flex: 1; min-height: 56px; height: 8vh;
    font-size: max(15px, 2.5vh); font-weight: 800;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; gap: 0.6em;
  }
  .tool i { flex: none; width: 1.1em; height: 1.1em; border-radius: 50%; border: 2px solid #fff; }
  .tool:active { background: var(--line); }
  .tool.sel { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tool.sel i { border-color: #000; }
  .tool:disabled { opacity: 0.4; }
</style>
</head>
<body data-status="idle" data-view="timer">

  <header class="topbar">
    <div class="brand">풋살 매니저</div>
    <nav class="tabs" id="tabs">
      <button class="tab sel" data-view="timer">타이머</button>
      <button class="tab" data-view="board">전술판</button>
    </nav>
    <div class="spacer"></div>
    <div class="mini">
      <span class="mini-status" id="miniStatus"></span>
      <span class="mini-time" id="miniTime">10:00</span>
      <button class="topbtn mini-btn" id="miniMain">시작</button>
    </div>
    <div class="chip" id="lockChip">화면 켜짐 유지 중</div>
    <button class="topbtn" id="soundTest">소리 테스트</button>
    <div class="version" id="version"></div>
  </header>

  <div class="view" id="viewTimer">
  <main class="stage">
    <div class="status" id="status">경기 시간</div>
    <div class="time" id="time">10:00</div>
    <div class="progress"><div id="bar"></div></div>

    <section class="settings">
      <div class="row">
        <label>경기 시간</label>
        <div class="opts" id="presets">
          <button class="opt step" data-step="-60000">−1분</button>
          <button class="opt step" data-step="-10000">−10초</button>
          <button class="opt" data-min="5">5분</button>
          <button class="opt" data-min="8">8분</button>
          <button class="opt" data-min="10">10분</button>
          <button class="opt" data-min="12">12분</button>
          <button class="opt" data-min="15">15분</button>
          <button class="opt" data-min="20">20분</button>
          <button class="opt step" data-step="10000">+10초</button>
          <button class="opt step" data-step="60000">+1분</button>
        </div>
      </div>
      <div class="row">
        <label>종료 전 알림</label>
        <div class="opts" id="warns">
          <button class="opt" data-warn="0">끔</button>
          <button class="opt" data-warn="30">30초 전</button>
          <button class="opt" data-warn="60">1분 전</button>
          <button class="opt" data-warn="120">2분 전</button>
          <button class="opt" data-warn="180">3분 전</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="controls">
    <button class="btn btn-reset" id="reset">리셋</button>
    <button class="btn btn-main" id="main">시작</button>
  </footer>
  </div>

  <div class="view" id="viewBoard">
    <div class="court-wrap" id="courtWrap">
      <div class="court" id="court">
        <svg viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
          <rect x="124" y="15" width="94" height="470" fill="#1A7A40"/><rect x="312" y="15" width="94" height="470" fill="#1A7A40"/><rect x="500" y="15" width="94" height="470" fill="#1A7A40"/><rect x="688" y="15" width="94" height="470" fill="#1A7A40"/><rect x="876" y="15" width="94" height="470" fill="#1A7A40"/>
          <g fill="none" stroke="#fff" stroke-width="4">
            <rect x="30" y="15" width="940" height="470"/>
            <line x1="500" y1="15" x2="500" y2="485"/>
            <circle cx="500" cy="250" r="70.5"/>
            <path d="M30,73.75 A141,141 0 0 1 171,214.75 L171,285.25 A141,141 0 0 1 30,426.25"/>
            <path d="M970,73.75 A141,141 0 0 0 829,214.75 L829,285.25 A141,141 0 0 0 970,426.25"/>
            <rect x="10" y="214.75" width="20" height="70.5"/>
            <rect x="970" y="214.75" width="20" height="70.5"/>
          </g>
          <g fill="#fff">
            <circle cx="500" cy="250" r="5"/>
            <circle cx="171" cy="250" r="4"/><circle cx="265" cy="250" r="4"/>
            <circle cx="829" cy="250" r="4"/><circle cx="735" cy="250" r="4"/>
          </g>
        </svg>
        <canvas id="ink"></canvas>
      </div>
    </div>
    <div class="tools" id="tools">
      <button class="tool sel" data-pen="#FFD60A"><i style="background:#FFD60A"></i>노랑 펜</button>
      <button class="tool" data-pen="#FFFFFF"><i style="background:#FFFFFF"></i>흰색 펜</button>
      <button class="tool" data-pen="#111111"><i style="background:#111111"></i>검정 펜</button>
      <button class="tool" id="eraser">지우개</button>
      <button class="tool" id="undo" disabled>되돌리기</button>
      <button class="tool" id="clearInk">그림 모두 지우기</button>
      <button class="tool" id="resetPieces">말 원위치</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var APP_VERSION = '0.2.0';
  var KEY = 'fm.timer.v1';
  var MIN_MS = 10 * 1000;
  var MAX_MS = 99 * 60 * 1000 + 50 * 1000;

  var $ = function (id) { return document.getElementById(id); };
  var elTime = $('time'), elStatus = $('status'), elBar = $('bar');
  var elMain = $('main'), elReset = $('reset'), elLock = $('lockChip');
  var elMiniTime = $('miniTime'), elMiniMain = $('miniMain'), elMiniStatus = $('miniStatus');

  $('version').textContent = 'v' + APP_VERSION;

  /* ---------- 상태 ---------- */
  var DEFAULTS = { durationMs: 10 * 60 * 1000, warnSec: 60, status: 'idle', endAt: 0, remainingMs: 10 * 60 * 1000, warned: false };
  var S = load();

  function load() {
    var s = {};
    try {
      var o = JSON.parse(localStorage.getItem(KEY));
      if (o && typeof o.durationMs === 'number') s = o;
    } catch (e) {}
    var out = {};
    for (var k in DEFAULTS) out[k] = (k in s) ? s[k] : DEFAULTS[k];
    return out;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* 남은 시간은 항상 종료 시각 기준으로 계산한다 */
  function remaining() {
    return S.status === 'running' ? S.endAt - Date.now() : S.remainingMs;
  }

  /* ---------- 동작 ---------- */
  function start() {
    if (S.status === 'idle') { S.remainingMs = S.durationMs; S.warned = false; }
    if (S.remainingMs <= S.warnSec * 1000) S.warned = true;
    S.endAt = Date.now() + S.remainingMs;
    S.status = 'running';
    save(); lockOn(); render();
  }
  function pause() {
    S.remainingMs = Math.max(0, S.endAt - Date.now());
    S.status = 'paused';
    save(); lockOff(); render();
  }
  function reset() {
    S.status = 'idle'; S.remainingMs = S.durationMs; S.warned = false; S.endAt = 0;
    stopSounds(); document.body.classList.remove('flash');
    save(); lockOff(); disarm(); render();
  }
  function finish(silent) {
    S.status = 'ended'; S.remainingMs = 0;
    document.body.classList.remove('flash');
    save(); lockOff(); disarm(); render();
    if (!silent) playEnd();
  }
  function warnAlert() {
    playWarn();
    var b = document.body;
    b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
    setTimeout(function () { b.classList.remove('flash'); }, 4200);
  }

  function tick() {
    if (S.status === 'running') {
      var r = remaining();
      if (r <= 0) { finish(false); return; }
      if (S.warnSec > 0 && !S.warned && r <= S.warnSec * 1000) {
        S.warned = true; save(); warnAlert();
      }
    }
    render();
  }

  /* ---------- 화면 ---------- */
  function fmt(ms) {
    var t = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(t / 60), s = t % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function warnLabel(sec) { return sec < 60 ? sec + '초' : (sec / 60) + '분'; }

  var last = {};
  function setText(el, key, v) { if (last[key] !== v) { last[key] = v; el.textContent = v; } }

  function render() {
    var st = S.status, r = remaining();
    var inWarn = (st === 'running' || st === 'paused') && S.warnSec > 0 && r <= S.warnSec * 1000;

    if (document.body.dataset.status !== st) document.body.dataset.status = st;
    document.body.classList.toggle('warn', inWarn);

    setText(elTime, 'time', fmt(st === 'idle' ? S.durationMs : r));

    var label = '경기 시간';
    if (st === 'running') label = inWarn ? '종료 ' + warnLabel(S.warnSec) + ' 전' : '진행 중';
    else if (st === 'paused') label = '일시정지';
    else if (st === 'ended') label = '경기 종료';
    setText(elStatus, 'status', label);

    var mainLabel = '시작';
    if (st === 'running') mainLabel = '일시정지';
    else if (st === 'paused') mainLabel = '계속';
    else if (st === 'ended') mainLabel = '확인';
    setText(elMain, 'main', mainLabel);
    setText(elMiniTime, 'mtime', fmt(st === 'idle' ? S.durationMs : r));
    setText(elMiniMain, 'mmain', mainLabel);
    setText(elMiniStatus, 'mstatus', st === 'idle' || (st === 'running' && !inWarn) ? '' : label);

    var p = S.durationMs > 0 ? Math.max(0, Math.min(1, r / S.durationMs)) : 0;
    var ps = 'scaleX(' + p.toFixed(4) + ')';
    if (last.bar !== ps) { last.bar = ps; elBar.style.transform = ps; }

    if (st === 'idle') {
      var key = S.durationMs + '|' + S.warnSec;
      if (last.sel !== key) {
        last.sel = key;
        var i, list = document.querySelectorAll('#presets [data-min]');
        for (i = 0; i < list.length; i++) list[i].classList.toggle('sel', Number(list[i].dataset.min) * 60000 === S.durationMs);
        list = document.querySelectorAll('#warns [data-warn]');
        for (i = 0; i < list.length; i++) list[i].classList.toggle('sel', Number(list[i].dataset.warn) === S.warnSec);
      }
    }
  }

  /* ---------- 버튼 ---------- */
  elMain.addEventListener('click', function () {
    unlockAudio();
    if (S.status === 'idle' || S.status === 'paused') start();
    else if (S.status === 'running') pause();
    else reset();
  });

  elMiniMain.addEventListener('click', function () { elMain.click(); });

  /* 리셋은 두 번 눌러야 실행된다 */
  var armTimer = null;
  function disarm() {
    clearTimeout(armTimer); armTimer = null;
    elReset.classList.remove('armed'); elReset.textContent = '리셋';
  }
  elReset.addEventListener('click', function () {
    if (armTimer) { reset(); return; }
    elReset.classList.add('armed'); elReset.textContent = '한 번 더 누르면 리셋';
    armTimer = setTimeout(disarm, 3000);
  });

  $('presets').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || S.status !== 'idle') return;
    var d = S.durationMs;
    if (b.dataset.min) d = Number(b.dataset.min) * 60000;
    else d += Number(b.dataset.step);
    S.durationMs = Math.max(MIN_MS, Math.min(MAX_MS, d));
    S.remainingMs = S.durationMs;
    save(); render();
  });
  $('warns').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.warnSec = Number(b.dataset.warn);
    save(); render();
  });
  $('soundTest').addEventListener('click', function () { unlockAudio(); stopSounds(); playWarn(); });

  /* PC 확인용: 스페이스바로 시작/일시정지 */
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); elMain.click(); }
  });

  /* ---------- 소리 (Web Audio로 직접 생성) ---------- */
  var ctx = null, live = [];
  function unlockAudio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  document.addEventListener('pointerdown', unlockAudio, { passive: true });

  function track(node) {
    live.push(node);
    node.onended = function () { var i = live.indexOf(node); if (i >= 0) live.splice(i, 1); };
  }
  function stopSounds() {
    var nodes = live.slice(); live = [];
    for (var i = 0; i < nodes.length; i++) { try { nodes[i].stop(); } catch (e) {} }
  }
  function beep(t, dur, freq) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
    g.gain.setValueAtTime(0.5, t + dur - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02); track(o);
  }
  /* 호루라기처럼 떨리는 소리 */
  function whistle(t, dur) {
    var o = ctx.createOscillator(), lfo = ctx.createOscillator();
    var depth = ctx.createGain(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 2350;
    lfo.type = 'sine'; lfo.frequency.value = 30; depth.gain.value = 180;
    lfo.connect(depth); depth.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
    g.gain.setValueAtTime(0.6, t + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
    track(o); track(lfo);
  }
  function playWarn() {
    if (!unlockAudio()) return;
    var t = ctx.currentTime + 0.05;
    for (var i = 0; i < 3; i++) beep(t + i * 0.32, 0.2, 1568);
  }
  function playEnd() {
    if (!unlockAudio()) return;
    var t = ctx.currentTime + 0.05;
    for (var k = 0; k < 2; k++) {
      var b = t + k * 2.9;
      whistle(b, 0.4); whistle(b + 0.55, 0.4); whistle(b + 1.1, 1.4);
    }
  }

  /* ---------- 화면 꺼짐 방지 ---------- */
  var wl = null;
  function lockOn() {
    if (!('wakeLock' in navigator) || wl) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wl = lock; elLock.classList.add('on');
      lock.addEventListener('release', function () { if (wl === lock) wl = null; elLock.classList.remove('on'); });
    }).catch(function () {});
  }
  function lockOff() {
    if (wl) { var l = wl; wl = null; l.release().catch(function () {}); }
    elLock.classList.remove('on');
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { tick(); if (S.status === 'running') lockOn(); }
  });

  /* ---------- 시작 ---------- */
  if (S.status === 'running') {
    if (S.endAt <= Date.now()) finish(true);   /* 앱이 닫힌 사이에 끝난 경우 */
    else lockOn();
  }
  render();
  setInterval(tick, 100);


  /* ================= 전술판 ================= */
  var BKEY = 'fm.board.v1';
  var elWrap = $('courtWrap'), elCourt = $('court'), cv = $('ink'), g = cv.getContext('2d');
  var DEF = {
    a1: [0.07, 0.5], a2: [0.20, 0.5], a3: [0.30, 0.22], a4: [0.30, 0.78], a5: [0.42, 0.5],
    b1: [0.93, 0.5], b2: [0.80, 0.5], b3: [0.70, 0.22], b4: [0.70, 0.78], b5: [0.58, 0.5],
    ball: [0.5, 0.5]
  };
  var IDS = Object.keys(DEF);
  function clonePieces(p) { var o = {}; IDS.forEach(function (k) { o[k] = [p[k][0], p[k][1]]; }); return o; }
  function norm(v) { return Math.round(Math.max(0, Math.min(1, v)) * 10000) / 10000; }

  var B = loadBoard();
  function loadBoard() {
    var b = { pieces: clonePieces(DEF), strokes: [] };
    try {
      var o = JSON.parse(localStorage.getItem(BKEY));
      if (o) {
        if (o.pieces) IDS.forEach(function (k) {
          var v = o.pieces[k];
          if (v && isFinite(v[0]) && isFinite(v[1])) b.pieces[k] = [norm(+v[0]), norm(+v[1])];
        });
        if (Array.isArray(o.strokes)) b.strokes = o.strokes.filter(function (s) {
          return s && typeof s.c === 'string' && Array.isArray(s.p) && s.p.length >= 2;
        });
      }
    } catch (e) {}
    return b;
  }
  function saveBoard() { try { localStorage.setItem(BKEY, JSON.stringify(B)); } catch (e) {} }

  /* 선수 말 */
  var pieceEls = {}, zTop = 10;
  IDS.forEach(function (id) {
    var el = document.createElement('div');
    el.className = 'piece ' + (id === 'ball' ? 'ball' : (id.charAt(0) === 'a' ? 'team-a' : 'team-b'));
    el.dataset.id = id;
    if (id !== 'ball') el.textContent = id.charAt(1) === '1' ? 'GK' : id.charAt(1);
    elCourt.appendChild(el); pieceEls[id] = el;
  });
  pieceEls.ball.style.zIndex = 11;
  function placePiece(id) {
    var p = B.pieces[id], el = pieceEls[id];
    el.style.left = (p[0] * 100) + '%'; el.style.top = (p[1] * 100) + '%';
  }
  IDS.forEach(placePiece);

  /* 코트 크기: 2:1 비율을 유지하며 남은 공간에 꽉 채운다 */
  var cw = 0, ch = 0;
  function layoutBoard() {
    if (view !== 'board') return;
    var w = elWrap.clientWidth, h = elWrap.clientHeight;
    if (!w || !h) return;
    cw = Math.floor(Math.min(w, h * 2)); ch = Math.floor(cw / 2);
    elCourt.style.width = cw + 'px'; elCourt.style.height = ch + 'px';
    elCourt.style.setProperty('--ps', Math.max(56, Math.round(ch * 0.085)) + 'px');
    var d = window.devicePixelRatio || 1;
    cv.width = Math.round(cw * d); cv.height = Math.round(ch * d);
    g.setTransform(d, 0, 0, d, 0, 0);
    redraw();
  }
  window.addEventListener('resize', layoutBoard);

  /* 그리기 */
  function lineW() { return Math.max(4, ch * 0.009); }
  function penStyle(c) { g.strokeStyle = c; g.fillStyle = c; g.lineWidth = lineW(); g.lineCap = 'round'; g.lineJoin = 'round'; }
  function drawStroke(s) {
    var p = s.p; penStyle(s.c);
    g.beginPath();
    if (p.length === 2) { g.arc(p[0] * cw, p[1] * ch, lineW() * 0.9, 0, Math.PI * 2); g.fill(); return; }
    g.moveTo(p[0] * cw, p[1] * ch);
    for (var i = 2; i < p.length; i += 2) g.lineTo(p[i] * cw, p[i + 1] * ch);
    g.stroke();
  }
  function redraw() {
    g.clearRect(0, 0, cw, ch);
    for (var i = 0; i < B.strokes.length; i++) drawStroke(B.strokes[i]);
  }

  /* 되돌리기: 말 이동·그리기·지우기·원위치를 모두 되돌린다 */
  var hist = [], elUndo = $('undo');
  function snap() {
    hist.push({ pieces: clonePieces(B.pieces), strokes: B.strokes.slice() });
    if (hist.length > 50) hist.shift();
    elUndo.disabled = false;
  }
  function undo() {
    var h = hist.pop(); if (!h) return;
    B.pieces = h.pieces; B.strokes = h.strokes;
    IDS.forEach(placePiece); redraw(); saveBoard();
    elUndo.disabled = hist.length === 0;
  }

  /* 지우개: 닿은 선을 통째로 지운다 */
  function segDist2(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    var t = l2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)) : 0;
    var qx = ax + t * dx - px, qy = ay + t * dy - py;
    return qx * qx + qy * qy;
  }
  function strokeNear(s, px, py, R2) {
    var p = s.p;
    if (p.length === 2) return segDist2(px, py, p[0] * cw, p[1] * ch, p[0] * cw, p[1] * ch) <= R2;
    for (var i = 2; i < p.length; i += 2) {
      if (segDist2(px, py, p[i - 2] * cw, p[i - 1] * ch, p[i] * cw, p[i + 1] * ch) <= R2) return true;
    }
    return false;
  }
  function eraseAt(x, y, a) {
    var px = x * cw, py = y * ch, R = Math.max(18, ch * 0.03), R2 = R * R;
    var keep = [], hit = false;
    for (var i = 0; i < B.strokes.length; i++) {
      if (strokeNear(B.strokes[i], px, py, R2)) hit = true; else keep.push(B.strokes[i]);
    }
    if (!hit) return;
    if (!a.snapped) { a.snapped = true; snap(); }
    B.strokes = keep; redraw();
  }

  /* 터치: 말 위에서 시작하면 말 이동, 빈 곳에서 시작하면 펜(또는 지우개). 여러 손가락 동시 사용 가능 */
  var acts = {}, penColor = '#FFD60A', eraser = false;
  elCourt.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  elCourt.addEventListener('pointerdown', function (e) {
    if (e.button > 0 || !cw) return;
    e.preventDefault();
    var r = elCourt.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    var pc = e.target.closest ? e.target.closest('.piece') : null;
    try { elCourt.setPointerCapture(e.pointerId); } catch (err) {}
    if (pc) {
      var id = pc.dataset.id, p = B.pieces[id];
      if (id !== 'ball') pc.style.zIndex = ++zTop;
      pieceEls.ball.style.zIndex = zTop + 1;
      pc.classList.add('drag');
      acts[e.pointerId] = { t: 'piece', id: id, dx: p[0] - x, dy: p[1] - y, moved: false };
    } else if (eraser) {
      var a = { t: 'erase', snapped: false };
      acts[e.pointerId] = a; eraseAt(x, y, a);
    } else {
      acts[e.pointerId] = { t: 'draw', s: { c: penColor, p: [norm(x), norm(y)] } };
    }
  });
  function moveAct(a, x, y) {
    if (a.t === 'piece') {
      if (!a.moved) { a.moved = true; snap(); }
      B.pieces[a.id] = [norm(Math.max(0.02, Math.min(0.98, x + a.dx))), norm(Math.max(0.04, Math.min(0.96, y + a.dy)))];
      placePiece(a.id);
    } else if (a.t === 'erase') {
      eraseAt(x, y, a);
    } else {
      var p = a.s.p, n = p.length, lx = p[n - 2], ly = p[n - 1];
      x = norm(x); y = norm(y);
      var ddx = (x - lx) * cw, ddy = (y - ly) * ch;
      if (ddx * ddx + ddy * ddy < 4) return;
      p.push(x, y);
      penStyle(a.s.c); g.beginPath(); g.moveTo(lx * cw, ly * ch); g.lineTo(x * cw, y * ch); g.stroke();
    }
  }
  elCourt.addEventListener('pointermove', function (e) {
    var a = acts[e.pointerId]; if (!a) return;
    var r = elCourt.getBoundingClientRect();
    var evs = (a.t === 'draw' && e.getCoalescedEvents) ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++) moveAct(a, (evs[i].clientX - r.left) / r.width, (evs[i].clientY - r.top) / r.height);
  });
  function endAct(e) {
    var a = acts[e.pointerId]; if (!a) return;
    delete acts[e.pointerId];
    if (a.t === 'piece') {
      pieceEls[a.id].classList.remove('drag');
      if (a.moved) saveBoard();
    } else if (a.t === 'draw') {
      snap(); B.strokes.push(a.s);
      if (a.s.p.length === 2) drawStroke(a.s);
      saveBoard();
    } else if (a.snapped) saveBoard();
  }
  elCourt.addEventListener('pointerup', endAct);
  elCourt.addEventListener('pointercancel', endAct);

  /* 도구 버튼 */
  var elEraser = $('eraser');
  function syncTools() {
    var pens = document.querySelectorAll('#tools [data-pen]');
    for (var i = 0; i < pens.length; i++) pens[i].classList.toggle('sel', !eraser && pens[i].dataset.pen === penColor);
    elEraser.classList.toggle('sel', eraser);
  }
  $('tools').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pen) { penColor = b.dataset.pen; eraser = false; syncTools(); }
    else if (b.id === 'eraser') { eraser = !eraser; syncTools(); }
    else if (b.id === 'undo') undo();
    else if (b.id === 'clearInk') { if (B.strokes.length) { snap(); B.strokes = []; redraw(); saveBoard(); } }
    else if (b.id === 'resetPieces') { snap(); B.pieces = clonePieces(DEF); IDS.forEach(placePiece); saveBoard(); }
  });

  /* ---------- 화면 전환 ---------- */
  var view = 'timer';
  function setView(v) {
    view = v; document.body.dataset.view = v;
    var tabs = document.querySelectorAll('#tabs .tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('sel', tabs[i].dataset.view === v);
    try { localStorage.setItem('fm.view', v); } catch (e) {}
    if (v === 'board') layoutBoard();
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setView(b.dataset.view);
  });
  try { if (localStorage.getItem('fm.view') === 'board') setView('board'); } catch (e) {}

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
